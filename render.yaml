services:
  - type: web
    name: geomanager
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn geomanager.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: geomanager-db
          property: connectionString
      - key: MAISHAPAY_API_URL
        sync: false
      - key: MAISHAPAY_API_KEY
        sync: false
      - key: MAISHAPAY_SECRET_KEY
        sync: false
      - key: MAISHAPAY_MERCHANT_ID
        sync: false
      - key: MAISHAPAY_CALLBACK_URL
        sync: false

databases:
  - name: geomanager-db
    plan: free
    databaseName: geomanager

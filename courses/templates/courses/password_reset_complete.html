{% extends "courses/base.html" %}
{% block title %}Mot de passe réinitialisé — Géomanager{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-white rounded-2xl shadow-sm border border-stone-100 p-8 text-center">
        <div class="w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-800 mb-2">Mot de passe réinitialisé !</h1>
        <p class="text-stone-500 text-sm">
            Votre mot de passe a été modifié avec succès. Vous pouvez maintenant vous connecter.
        </p>
        <div class="mt-6">
            <a href="{% url 'courses:login' %}"
               class="inline-block bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 px-8 rounded-xl
                      shadow-lg shadow-amber-500/20 transition-all">
                Se connecter
            </a>
        </div>
    </div>
</div>
{% endblock %}
